    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"

}

/* Fireworks & Confetti Engine */
const canvas = document.getElementById("fx-canvas");
const ctx = canvas.getContext("2d");
let particles = [];
let animRunning = false;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

const FX_COLORS = [
  "#f3d69f", "#d8b477", "#fff4d4",
  "#e05353", "#ff9e7d", "#ffffff"
];

function launchCelebration(originX, originY) {
  const w = canvas.width;
  const h = canvas.height;
  const cx = typeof originX === "number" ? originX : w * 0.5;
  const cy = typeof originY === "number" ? originY : h * 0.26;

  for (let i = 0; i < 110; i++) {
    particles.push({
      type: "confetti",
      x: Math.random() * w,
      y: -20 - Math.random() * h * 0.35,
      vx: (Math.random() - 0.5) * 4,
      vy: 2 + Math.random() * 4.5,
      size: 6 + Math.random() * 6,
      rot: Math.random() * 360,
      vRot: (Math.random() - 0.5) * 10,
      color: FX_COLORS[Math.floor(Math.random() * FX_COLORS.length)],
      alpha: 1,
      decay: 0.0045 + Math.random() * 0.004
    });
  }

  const bursts = [
    [cx, cy],
    [w * 0.25, h * 0.3],
    [w * 0.75, h * 0.28]
  ];

  bursts.forEach(([bx, by], idx) => {
    setTimeout(() => {
      for (let i = 0; i < 60; i++) {
        const angle = (Math.PI * 2 * i) / 60 + Math.random() * 0.1;
        const speed = 2 + Math.random() * 6;

        particles.push({
          type: "spark",
          x: bx,
          y: by,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 2.5 + Math.random() * 2.5,
          color: FX_COLORS[Math.floor(Math.random() * FX_COLORS.length)],
          alpha: 1,
          decay: 0.014 + Math.random() * 0.01
        });
      }

      startFxLoop();
    }, idx * 240);
  });

  startFxLoop();
}

function startFxLoop() {
  if (animRunning) return;

  animRunning = true;

  function step() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;

      if (p.type === "spark") {
        p.vy += 0.08;
        p.vx *= 0.98;
      } else {
        p.rot += p.vRot;
        p.x += Math.sin(p.y * 0.03) * 0.8;
      }

      p.alpha -= p.decay;

      if (p.alpha > 0) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;

        if (p.type === "confetti") {
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size * 0.55);
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }
    });

    particles = particles.filter(
      p => p.alpha > 0 && p.y < canvas.height + 40
    );

    if (particles.length > 0) {
      requestAnimationFrame(step);
    } else {
      animRunning = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  requestAnimationFrame(step);
}

/* 2. Countdown */
const target = new Date("2026-11-29T12:00:00+09:00").getTime();

function updateCountdown() {
  let diff = target - Date.now();

  if (diff <= 0) {
    document.querySelector(".count-label").textContent =
      "THE CELEBRATION IS NOW IN SESSION";
    diff = 0;
  }

  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);

  document.getElementById("days").textContent = pad(d);
  document.getElementById("hours").textContent = pad(h);
  document.getElementById("minutes").textContent = pad(m);
  document.getElementById("seconds").textContent = pad(s);
}

updateCountdown();
setInterval(updateCountdown, 1000);

let awardIndex = 0;
let selectedNominee = null;
let revealedAwards = new Set();

const awardPipsEl = document.getElementById("awardPips");
const awardQuizArea = document.getElementById("awardQuizArea");
const awardNumTitle = document.getElementById("awardNumTitle");

const nomineesGrid = document.getElementById("nomineesGrid");

const verdictBox = document.getElementById("verdictBox");

const verdictWinner = document.getElementById("verdictWinner");
const nextAwardBtn = document.getElementById("nextAwardBtn");
const awardsCompleteBox = document.getElementById("awardsCompleteBox");

function renderAwardPips() {
  awardPipsEl.innerHTML = AWARDS_DATA.map((item, idx) => {
    const cls = ["award-pip"];

    if (idx === awardIndex) cls.push("active");
    if (revealedAwards.has(idx)) cls.push("done");

    return `
      <button type="button" class="${cls.join(" ")}" data-idx="${idx}">
        ${pad(idx + 1)}
      </button>
    `;
  }).join("");
}

function renderAwardQuestion() {
  renderAwardPips();

  if (
    revealedAwards.size === AWARDS_DATA.length &&
    awardIndex >= AWARDS_DATA.length
  ) {
    awardQuizArea.style.display = "none";
    awardsCompleteBox.classList.add("unlocked");
    return;
  }

  awardQuizArea.style.display = "block";
  awardsCompleteBox.classList.remove("unlocked");

  const item = AWARDS_DATA[awardIndex];

  selectedNominee = null;
  awardFeedback.textContent = "";
  verdictBox.classList.remove("show");

  awardNumTitle.textContent = `${item.num}. ${item.title}`;
  awardCategory.textContent = item.category;
  awardQuestion.textContent = item.question;

  nomineesGrid.innerHTML = item.nominees.map((nom, idx) => `
    <button type="button" class="nominee-btn" data-choice="${idx}">
      <span class="nominee-idx">${idx + 1}.</span>
      <span>${escapeHtml(nom)}</span>
    </button>
  `).join("");

  nextAwardBtn.textContent =
    awardIndex === AWARDS_DATA.length - 1
      ? "최종 트로피 확인하기 ✦"
      : "다음 문항으로 →";
}

awardPipsEl.addEventListener("click", e => {
  const pip = e.target.closest(".award-pip");
  if (!pip) return;

  awardIndex = Number(pip.dataset.idx);
  renderAwardQuestion();
});

  const btn = e.target.closest(".nominee-btn");
  if (!btn) return;

  selectedNominee = Number(btn.dataset.choice);

  nomineesGrid.querySelectorAll(".nominee-btn").forEach((el, idx) => {
    el.classList.toggle("selected", idx === selectedNominee);
  });

  awardFeedback.textContent = "";
});

checkAwardBtn.addEventListener("click", () => {
  const item = AWARDS_DATA[awardIndex];

  if (selectedNominee === null) {
    awardFeedback.textContent = "후보 중 하나를 먼저 선택해 주세요.";
    return;
  }

  if (selectedNominee === item.answerIndex) {
    awardFeedback.style.color = "#ffe2a8";
    awardFeedback.textContent =
      "정답입니다! 공식 수상 기록이 봉인 해제되었습니다.";

    revealedAwards.add(awardIndex);

    verdictTag.textContent = item.verdictLabel;
    verdictWinner.textContent = item.verdictText;
    verdictBox.classList.add("show");

    renderAwardPips();
  } else {
    awardFeedback.style.color = "#ff9c9c";
    awardFeedback.textContent =
      "아쉽습니다! 다른 후보를 선택해 다시 도전해 보세요.";
  }
});

nextAwardBtn.addEventListener("click", () => {
  if (awardIndex < AWARDS_DATA.length - 1) {
    awardIndex++;
    renderAwardQuestion();
  } else {
    awardIndex = AWARDS_DATA.length;
    renderAwardQuestion();
    launchCelebration();
  }
});

document.getElementById("restartAwardsBtn").addEventListener("click", () => {
  awardIndex = 0;
  revealedAwards.clear();
  renderAwardQuestion();
});

/* 5. Firebase Guestbook */
const guestbookForm = document.getElementById("guestbookForm");
const guestName = document.getElementById("guestName");
const guestText = document.getElementById("guestText");
const msgList = document.getElementById("msgList");
const msgCollection = collection(db, "guestbook");

/* 날짜 표시 */
function formatMessageDate(timestamp) {
  if (!timestamp || typeof timestamp.toDate !== "function") {
    return "방금 전";
  }

  const date = timestamp.toDate();

  return [
    date.getFullYear(),
    pad(date.getMonth() + 1),
    pad(date.getDate())
  ].join(".");
}

/* 실시간으로 모든 방문자의 메시지 불러오기 */
const guestbookQuery = query(
  msgCollection,
  orderBy("createdAt", "desc")
);

onSnapshot(
  guestbookQuery,
  snapshot => {
    if (snapshot.empty) {
      msgList.innerHTML = `
        <div class="msg-item">
          <div class="msg-head">
            <b>GALA COMMITTEE</b>
            <span>2026.11.29</span>
          </div>
          <p class="msg-body">
            아령이의 찬란한 생일을 진심으로 축하합니다!
            오늘 가장 빛나는 주인공이 되길.
          </p>
        </div>
      `;
      return;
    }

    msgList.innerHTML = snapshot.docs.map(doc => {
      const message = doc.data();

      return `
        <div class="msg-item">
          <div class="msg-head">
            <b>${escapeHtml(message.name || "익명")}</b>
            <span>${escapeHtml(formatMessageDate(message.createdAt))}</span>
          </div>
          <p class="msg-body">${escapeHtml(message.text || "")}</p>
        </div>
      `;
    }).join("");
  },
  error => {
    console.error("방명록 불러오기 오류:", error);
    msgList.innerHTML = `
      <div class="msg-item">
        <p class="msg-body">
          방명록을 불러오지 못했습니다. 잠시 후 다시 접속해 주세요.
        </p>
      </div>
    `;
  }
);

/* 축하 메시지 저장 */
guestbookForm.addEventListener("submit", async e => {
  e.preventDefault();

  const name = guestName.value.trim();
  const text = guestText.value.trim();
  const submitButton = guestbookForm.querySelector(".msg-submit");

  if (!name || !text) {
    alert("이름과 축하 메시지를 모두 입력해 주세요.");
    return;
  }

  if (name.length > 20 || text.length > 200) {
    alert("이름은 20자, 메시지는 200자 이내로 작성해 주세요.");
    return;
  }

  submitButton.disabled = true;
  submitButton.textContent = "메시지 전달 중...";

  try {
    await addDoc(msgCollection, {
      name: name,
      text: text,
      createdAt: serverTimestamp()
    });

    guestText.value = "";
    alert("축하 메시지가 성공적으로 전달되었습니다! ✦");
  } catch (error) {
    console.error("방명록 저장 오류:", error);
    alert("메시지 저장에 실패했습니다. 잠시 후 다시 시도해 주세요.");
  } finally {
    submitButton.disabled = false;
    submitButton.textContent = "축하 메시지 남기기 ✦";
  }
});
</script>
