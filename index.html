<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "여기에_본인_API_KEY",
  authDomain: "여기에_본인_PROJECT_ID.firebaseapp.com",
  databaseURL: "여기에_본인_DATABASE_URL",
  projectId: "여기에_본인_PROJECT_ID",
  storageBucket: "여기에_본인_PROJECT_ID.appspot.com",
  messagingSenderId: "여기에_SENDER_ID",
  appId: "여기에_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const messagesRef = query(ref(db, "gala_messages"), limitToLast(100));

const DEFAULT_MESSAGES = [
  { name: "GALA COMMITTEE", text: "아령이의 찬란한 생일을 진심으로 축하합니다! 오늘 가장 빛나는 주인공이 되길.", date: "2026.11.29" }
];

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[s]));
}

function renderList(items){
  const list = document.getElementById("msgList");
  if(!list) return;
  const rows = items.length ? items : DEFAULT_MESSAGES;
  list.innerHTML = rows.map(m => `
    <div class="msg-item">
      <div class="msg-head"><b>${escapeHtml(m.name)}</b><span>${escapeHtml(m.date)}</span></div>
      <p class="msg-body">${escapeHtml(m.text)}</p>
    </div>
  `).join("");
}

onValue(messagesRef, snapshot => {
  const val = snapshot.val();
  if(!val){
    renderList(DEFAULT_MESSAGES);
    return;
  }
  const items = Object.values(val).reverse();
  renderList(items);
});

const guestbookForm = document.getElementById("guestbookForm");
if(guestbookForm){
  guestbookForm.addEventListener("submit", async e => {
    e.preventDefault();
    const nameEl = document.getElementById("guestName");
    const textEl = document.getElementById("guestText");
    const name = nameEl.value.trim();
    const text = textEl.value.trim();
    if(!name || !text) return;

    const now = new Date();
    const pad = n => String(n).padStart(2, "0");
    const dateStr = `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())}`;

    try{
      await push(ref(db, "gala_messages"), { name, text, date: dateStr, createdAt: Date.now() });
      textEl.value = "";
    } catch(err){
      alert("메시지 저장 중 오류가 발생했습니다. Firebase 데이터베이스 규칙을 확인해 주세요.");
    }
  });
}
</script>
